name: Build and test
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: brew install libmtp pkg-config
      - name: Test
        run: swift test
      - name: Package app
        run: |
          bash scripts/build-app.sh release
          ditto -c -k --sequesterRsrc --keepParent dist/DroidDock.app dist/DroidDock-macOS-${{ runner.arch }}.zip
          python3 scripts/package-usb-sources.py
      - uses: actions/upload-artifact@v4
        with:
          name: DroidDock-macOS-${{ runner.arch }}
          path: |
            dist/DroidDock-macOS-*.zip
            dist/DroidDock-USB-library-sources.zip
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test transfer safety and recursive sizes
        run: dotnet run --project windows/DroidDock.Tests -c Release
      - name: Publish standalone Windows app
        run: dotnet publish windows/DroidDock.Windows -c Release -r win-x64 --self-contained true -o dist/windows
      - name: Test one-click setup, shortcuts, launcher, and sample UI
        shell: pwsh
        timeout-minutes: 3
        run: |
          $capturePath = Join-Path $pwd 'dist/windows-files.png'
          $testInstallPath = Join-Path $env:RUNNER_TEMP 'DroidDock Setup Test'
          & cmd.exe /d /c dist\windows\Setup.cmd --smoke-test "$testInstallPath"
          if ($LASTEXITCODE -ne 0) { throw 'One-click setup smoke test failed' }
          Copy-Item (Join-Path $testInstallPath 'setup-smoke.png') $capturePath
          $shell = New-Object -ComObject WScript.Shell
          $shortcut = $shell.CreateShortcut((Join-Path $testInstallPath 'test-shortcuts/Desktop/DroidDock.lnk'))
          if ($shortcut.TargetPath -ne (Join-Path $testInstallPath 'DroidDock.exe')) { throw 'Shortcut points to the wrong app' }
          Compress-Archive -Path dist/windows/* -DestinationPath dist/DroidDock-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DroidDock-Windows-x64
          path: dist/DroidDock-Windows-x64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: dist/windows-files.png
          if-no-files-found: error
